<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A162B" />
      <stop offset="100%" stop-color="#0B0B14" />
    </linearGradient>

    <linearGradient id="neonAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#EC4899" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- พื้นหลัง Dark Mode พร้อมขอบเรืองแสง -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#darkBg)" stroke="url(#neonAccent)" stroke-width="10" />

  <!-- วงแหวน Universal Portal ด้านหลัง -->
  <circle cx="256" cy="240" r="130" stroke="url(#neonAccent)" stroke-width="12" stroke-opacity="0.25" stroke-dasharray="40 20" fill="none" />

  <!-- ลูกศรและถาดดาวน์โหลด -->
  <g filter="url(#neonGlow)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M256 124V304" stroke="#FFFFFF" stroke-width="42" />
    <path d="M176 232L256 312L336 232" stroke="url(#neonAccent)" stroke-width="42" />
    <path d="M160 384H352" stroke="url(#neonAccent)" stroke-width="40" />
  </g>
</svg>

name: Release build

# Tags are created at publish time and never moved or deleted. For v1.0.0 the
# release is produced locally with scripts/verify-release.mjs; this workflow is
# the repeatable path for later versions.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only; do not create a GitHub release"
        type: boolean
        default: true
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Signing is optional: unset secrets build an unsigned installer.
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest pyinstaller

      - name: Backend tests
        run: python -m pytest backend/tests -q

      - name: Build backend engine
        working-directory: backend
        run: pyinstaller --noconfirm backend-engine.spec

      - name: Stage backend engine
        shell: pwsh
        run: |
          Remove-Item desktop/backend-engine/* -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item backend/dist/backend-engine/* -Destination desktop/backend-engine -Recurse -Force

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Stage frontend
        shell: pwsh
        run: |
          Remove-Item desktop/frontend-out/* -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item frontend/out/* -Destination desktop/frontend-out -Recurse -Force

      - name: Desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Desktop updater tests
        working-directory: desktop
        run: npm test

      - name: Package (no publish)
        working-directory: desktop
        run: npx electron-builder --publish never

      - name: Stage release assets
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "desktop/dist-release/Universal Downloader Setup $version.exe" "release/Universal-Downloader-Setup-$version.exe" -Force
          Copy-Item "desktop/dist-release/Universal Downloader Setup $version.exe.blockmap" "release/Universal-Downloader-Setup-$version.exe.blockmap" -Force
          Copy-Item "desktop/dist-release/Universal Downloader-$version-win.zip" "release/Universal.Downloader-$version-win.zip" -Force
          Copy-Item "desktop/dist-release/latest.yml" release/latest.yml -Force
          $names = "Universal-Downloader-Setup-$version.exe","Universal-Downloader-Setup-$version.exe.blockmap","Universal.Downloader-$version-win.zip","latest.yml"
          $lines = foreach ($n in $names) { "{0}  {1}" -f (Get-FileHash "release/$n" -Algorithm SHA256).Hash, $n }
          [IO.File]::WriteAllText("$PWD/release/SHA256SUMS-$version.txt", ($lines -join "`n") + "`n", (New-Object System.Text.UTF8Encoding($false)))

      - name: Verify release
        run: node scripts/verify-release.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error

      - name: Create draft release
        if: github.event_name == 'push' || inputs.dry_run == false
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          gh release create "v$version" --draft --target $env:GITHUB_SHA `
            --title "v$version" --notes-file "docs/releases/v$version.md" `
            "release/Universal-Downloader-Setup-$version.exe" `
            "release/Universal-Downloader-Setup-$version.exe.blockmap" `
            "release/Universal.Downloader-$version-win.zip" `
            "release/latest.yml" `
            "release/SHA256SUMS-$version.txt"

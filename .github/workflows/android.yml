name: Android checks

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  push:
    branches:
      - "**"
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        working-directory: mobile
        run: |
          chmod +x gradlew
          # Retry covers Gradle distribution/CDN flakes; real failures still fail three times.
          for attempt in 1 2 3; do
            if ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace; then
              exit 0
            fi
            echo "Gradle failed (attempt $attempt/3); retrying in 10s..." >&2
            sleep 10
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

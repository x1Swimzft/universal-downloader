name: Android pre-release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#android-v}"
          mkdir -p android-release
          cp mobile/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk android-release/
          cp mobile/app/build/outputs/apk/debug/app-x86_64-debug.apk android-release/
          if ls android-release | grep -qiE '^latest.*\.ya?ml$'; then
            echo "refusing to publish updater metadata in an Android release" >&2
            exit 1
          fi
          (cd android-release && sha256sum *.apk > "SHA256SUMS-android-${version}.txt")
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --prerelease \
            --title "Universal Downloader Android v${VERSION}" \
            --notes-file "docs/releases/android-v${VERSION}.md" \
            android-release/app-arm64-v8a-debug.apk \
            android-release/app-x86_64-debug.apk \
            "android-release/SHA256SUMS-android-${VERSION}.txt"

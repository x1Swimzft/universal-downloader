ng with a skier \\ud83d\\ude02. \\n\\nAnd thanks to an all star crew for dealing with the faf, these things aren\\u2019t easy and only happen with a bit of elbow greese and engenuity. \\u0040bdanncreative \\u0040sam_saarel \\u0040blkmtnfilm.\\n\\nMore to come \\ud83d\\ude4c\\n\\n\\u0040smartwool #gofarfeelgood \\n\\nAll the good \\ud83d\\udcf8s: \\u0040sam_saarel\"}}]},\"edge_media_to_comment\":{\"count\":25},\"edge_liked_by\":{\"count\":645},\"owner\":{\"id\":\"0\",\"username\":\"example_user\",\"is_verified\":true,\"profile_pic_url\":\"https:\\/\\/scontent.cdninstagram.com\\/v\\/t51.2885-19\\/19955481_1692458997728849_6153327730046795776_a.jpg?stp=REDACTED&_nc_cat=REDACTED&ccb=REDACTED&_nc_sid=REDACTED&efg=REDACTED\\u00253D&_nc_ohc=REDACTED&_nc_oc=REDACTED&_nc_zt=REDACTED&_nc_ht=REDACTED&_nc_ss=REDACTED&oh=REDACTED&oe=REDACTED\",\"edge_followed_by\":{\"count\":70438}},\"edge_sidecar_to_children\":{\"edges\":[{\"node\":{\"id\":\"0\",\"shortcode\":\"DJFnRegOj_Q\",\"is_video\":false,\"display_url\":\"https:\\/\\/instagram.fkdt1-1.fna.fbcdn.net\\/v\\/t51.75761-15\\/494485978_18499504510019614_7991921797786553756_n.jpg?stp=REDACTED&_nc_cat=REDACTED&_nc_map=REDACTED&ig_cache_key=REDACTED\\u00253D\\u00253D.3-ccb7-5&ccb=REDACTED&_nc_sid=REDACTED&efg=REDACTED&_nc_ohc=REDACTED&_nc_oc=REDACTED&_nc_zt=REDACTED&_nc_ht=REDACTED&_nc_gid=REDACTED&_nc_ss=REDACTED&oh=REDACTED&oe=REDACTED\",\"display_resources\":[{\"src\":\"https:\\/\\/instagram.fkdt1-1.fna.fbcdn.net\\/v\\/t51.75761-15\\/494485978_18499504510019614_7991921797786553756_n.jpg?stp=REDACTED&_nc_cat=REDACTED&_nc_map=REDACTED&ig_cache_key=REDACTED\\u00253D\\u00253D.3-ccb7-5&ccb=REDACTED&_nc_sid=REDACTED&efg=REDACTED&_nc_ohc=REDACTED&_nc_oc=REDACTED&_nc_zt=REDACTED&_nc_ht=REDACTED&_nc_gid=REDACTED&_nc_ss=REDACTED&oh=REDACTED&oe=REDACTED\",\"config_width\":1440,\"config_height\":1800},{\"src\":\"https:\\/\\/instagram.fkdt1-1.fna.fbcdn.net\\/v\\/t51.75761-15\\/494485978_18499504510019614_7991921797786553756_n.jpg?stp=REDACTE
